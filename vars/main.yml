---
upgrade: true

apt_packages:
  - ffmpeg
  - inkscape
  - pandoc
  - texlive-full
  - graphviz
  - ripgrep
  - duf
  - fd-find
  - bat
  - eza
  - fzf
  - jq
  - tree
  - hyperfine
  - tmux
  - sqlite3
  - postgresql-client
  - git-lfs
  - 7zip
  - wget
  - rsync
  - zip
  - build-essential
  - cmake
  - pkg-config

apt_packages_exclude: []

snap_packages: "{{ ['drawio'] if ansible_facts['distribution'] == 'Fedora' else ['drawio', 'btop', 'procs', 'dust'] }}"

chromium_source: "{{ 'snap' if ansible_facts['distribution'] == 'Ubuntu' else 'dnf' if ansible_facts['distribution'] == 'Fedora' else 'apt' }}"

pacman_packages:
  - ffmpeg
  - inkscape
  - pandoc-cli
  - texlive-meta
  - texlive-lang
  - graphviz
  - ripgrep
  - duf
  - fd
  - bat
  - eza
  - fzf
  - jq
  - tree
  - hyperfine
  - tmux
  - sqlite
  - postgresql-libs
  - git-lfs
  - 7zip
  - wget
  - rsync
  - zip
  - base-devel
  - cmake
  - pkgconf
  - bash-completion
  - drawio-desktop
  - btop
  - procs
  - dust
  - chromium

pacman_packages_exclude: []

dnf_packages:
  - ffmpeg-free
  - inkscape
  - pandoc
  - texlive-scheme-full
  - graphviz
  - ripgrep
  - duf
  - fd-find
  - bat
  - eza
  - fzf
  - jq
  - tree
  - hyperfine
  - tmux
  - sqlite
  - postgresql
  - git-lfs
  - 7zip
  - wget
  - rsync
  - zip
  - gcc
  - gcc-c++
  - make
  - cmake
  - pkgconf-pkg-config
  - bash-completion
  - btop
  - procs
  - du-dust
  - chromium

dnf_packages_exclude: []

uv_python_versions: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

uv_tools:
  - ruff
  - ty
  - pytest
  - cookiecutter
  - pre-commit
  - crewai
  - llmfit
  - mlflow
  - httpx2[cli]
  - huggingface-hub
  - fastapi[standard]
  - typer
  - ipython
  - jupyterlab --with-executables-from jupyter-core
  - marimo
  - mkdocs
  - openai-whisper
  - polars-cli
  - streamrip --python 3.13
  - taplo
  - uvicorn
  - yt-dlp
  - markitdown

nerd_fonts:
  - JetBrainsMono

nvidia_enabled: false

nvidia_driver_package: nvidia-open

nvidia_cuda_package: "{{ 'cuda' if ansible_facts['os_family'] == 'Archlinux' else 'cuda-toolkit' }}"
