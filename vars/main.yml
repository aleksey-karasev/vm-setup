  - graphviz
  - ripgrep
  - duf
  - fd
  - bat
  - eza
  - fzf
  - zoxide
  - jq
  - tree
  - hyperfine
  - tmux
  - micro
  - sqlite
  - openssh
  - mtr
  - fail2ban
  - libpq
  - git-lfs
  - git-delta
  - shellcheck
  - shfmt
  - just
  - sevenzip
  - wget
  - rsync
  - restic
  - go
  - rust
  - cmake
  - pkgconf
  - bash-completion@2
  - btop
  - procs
  - dust

brew_packages_exclude: []

# Chromium's Homebrew cask is disabled; use its maintained ungoogled build.
brew_casks:
  - inkscape
  - drawio
  - ungoogled-chromium

brew_casks_exclude: []

uv_python_versions: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

uv_tools:
  - ruff
  - ty
  - pytest
  - cookiecutter
  - pre-commit
  - ansible-lint --python 3.13
  - crewai
  - llmfit
  - mlflow
  - httpx2[cli]
  - huggingface-hub
  - ipython
  - jupyterlab --with-executables-from jupyter-core
  - marimo
  - mkdocs
  - openai-whisper
  - streamrip --python 3.13
  - taplo
  - yt-dlp
  - markitdown
  - visidata
  # Use a managed Python with wheels for Harlequin's native dependencies.
  - harlequin --python 3.13

nerd_fonts:
  - JetBrainsMono

nvidia_enabled: false

nvidia_driver_package: nvidia-open

nvidia_cuda_package: "{{ 'cuda' if ansible_facts['os_family'] == 'Archlinux' else 'cuda-toolkit' }}"
