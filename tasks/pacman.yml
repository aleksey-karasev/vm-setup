---
- name: Install pacman packages
  ansible.builtin.command:
    argv: "{{ ['pacman', '-S', '--needed', '--noconfirm'] + pacman_packages_to_install }}"
  environment:
    LC_ALL: C
  become: true
  register: pacman_install
  changed_when: "'there is nothing to do' not in pacman_install.stdout"
  when: pacman_packages_to_install | length > 0
  vars:
    # mtr and mtr-gtk provide the same command and conflict.
    mtr_packages_to_skip: "{{ ['mtr'] if mtr_binary.stat.executable | default(false) else [] }}"
    pacman_packages_to_install: "{{ pacman_packages | difference(pacman_packages_exclude + mtr_packages_to_skip) }}"
