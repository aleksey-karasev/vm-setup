---
- name: Install Docker and Colima on macOS
  ansible.builtin.import_tasks: homebrew.yml
  vars:
    homebrew_names: [docker, docker-buildx, docker-compose, colima]
  when: ansible_facts['os_family'] == 'Darwin'

- name: Configure Docker on macOS
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: Create the Docker CLI plugin directory
      ansible.builtin.file:
        path: "{{ home }}/.docker/cli-plugins"
        state: directory
        mode: "0755"

    - name: Expose Docker CLI plugins
      ansible.builtin.file:
        src: "{{ homebrew_prefix }}/lib/docker/cli-plugins/docker-{{ item }}"
        dest: "{{ home }}/.docker/cli-plugins/docker-{{ item }}"
        state: link
      loop: [buildx, compose]

    - name: Check Colima status
      ansible.builtin.command: colima status
      register: colima_status
      changed_when: false
      failed_when: colima_status.rc not in [0, 1]
      check_mode: false

    - name: Start Colima
      ansible.builtin.command: colima start
      when: colima_status.rc != 0
      changed_when: true

- name: Install Docker Engine from Docker's apt repository
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Remove distro packages that conflict with Docker Engine
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
      become: true

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ deb_arch }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
      become: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true

- name: Install Docker Engine
  ansible.builtin.command: pacman -S --needed --noconfirm docker docker-buildx docker-compose
  environment:
    LC_ALL: C
  become: true
  register: docker_pacman
  changed_when: "'there is nothing to do' not in docker_pacman.stdout"
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Install Docker Engine from Docker's Fedora repository
  when: ansible_facts['distribution'] == 'Fedora'
  become: true
  vars:
    docker_conflicting_packages:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-selinux
      - docker-engine-selinux
      - docker-engine
      - podman-docker
      - moby-engine
    docker_packages_to_remove: "{{ docker_conflicting_packages | intersect(docker_rpm_packages.stdout_lines) }}"
  block:
    # DNF also matches virtual provides: docker-selinux can select container-selinux,
    # which Docker CE itself requires. Remove only installed package names.
    - name: List installed RPM package names
      ansible.builtin.command: rpm -qa --queryformat '%{NAME}\n'
      register: docker_rpm_packages
      changed_when: false
      check_mode: false

    - name: Remove distro packages that conflict with Docker Engine
      ansible.builtin.dnf:
        name: "{{ docker_packages_to_remove }}"
        state: absent
        use_backend: dnf5
      when: docker_packages_to_remove | length > 0

    - name: Add Docker Fedora repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"

    - name: Install Docker Engine
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        use_backend: dnf5

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  become: true
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Let the user run docker without sudo
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: true
  become: true
  when:
    - username != 'root'
    - ansible_facts['os_family'] != 'Darwin'
