---
- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ (apt_packages | difference(apt_packages_exclude + mtr_packages_to_skip)) + (['chromium'] if chromium_source == 'apt' else []) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  vars:
    # An existing GTK build already provides the mtr command.
    mtr_packages_to_skip: "{{ ['mtr-tiny'] if mtr_binary.stat.executable | default(false) else [] }}"

- name: Expose fd and bat under their upstream names
  ansible.builtin.file:
    src: "/usr/bin/{{ item.packaged }}"
    dest: "{{ local_bin }}/{{ item.upstream }}"
    state: link
  loop:
    - { upstream: fd, packaged: fdfind }
    - { upstream: bat, packaged: batcat }
  when: ('/usr/bin/' ~ item.packaged) is exists
