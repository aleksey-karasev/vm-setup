---
- name: Install snapd
  ansible.builtin.apt:
    name: snapd
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install snapd on Fedora
  ansible.builtin.dnf:
    name: snapd
    state: present
    use_backend: dnf5
  become: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: Expose the Fedora snap mount directory
  ansible.builtin.file:
    src: /var/lib/snapd/snap
    dest: /snap
    state: link
  become: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: Enable and start the Fedora snapd socket
  ansible.builtin.systemd_service:
    name: snapd.socket
    state: started
    enabled: true
  become: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: Wait for snapd to finish seeding
  ansible.builtin.command: snap wait system seed.loaded
  become: true
  changed_when: false

- name: Install snaps
  ansible.builtin.command: "snap install {{ item }}"
  args:
    creates: "/snap/{{ item }}/current"
  become: true
  loop: "{{ snap_packages + (['chromium'] if chromium_source == 'snap' else []) }}"

- name: Refresh snaps
  ansible.builtin.command: snap refresh
  become: true
  register: snap_refresh
  changed_when: "'All snaps up to date' not in snap_refresh.stderr"
  when: upgrade | bool
