---
- name: Install or update starship
  ansible.builtin.import_tasks: tool.yml
  vars:
    tool_name: starship
    tool_bin: "{{ local_bin ~ '/starship' if ansible_facts['os_family'] == 'Darwin' else '/usr/local/bin/starship' }}"
    tool_install: "curl -sS https://starship.rs/install.sh | sh -s -- -y --bin-dir {{ (local_bin if ansible_facts['os_family'] == 'Darwin' else '/usr/local/bin') | quote }}"
    tool_become: "{{ ansible_facts['os_family'] != 'Darwin' }}"

- name: Create ~/.config
  ansible.builtin.file:
    path: "{{ home }}/.config"
    state: directory
    mode: "0755"

- name: Install starship config
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ home }}/.config/starship.toml"
    mode: "0644"

- name: Enable starship in bash
  ansible.builtin.blockinfile:
    path: "{{ home }}/.bashrc"
    marker: "# {mark} starship (managed by vm-setup)"
    block: eval "$(starship init bash)"
    create: true
    mode: "0644"

- name: Enable starship in zsh
  ansible.builtin.blockinfile:
    path: "{{ home }}/.zshrc"
    marker: "# {mark} starship (managed by vm-setup)"
    block: eval "$(starship init zsh)"
    create: true
    mode: "0644"
  when: ansible_facts['os_family'] == 'Darwin'
