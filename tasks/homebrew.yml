---
# Use only ansible-core, as on Linux; Homebrew always runs as the login user.
- name: List installed Homebrew packages
  ansible.builtin.command:
    argv: ["{{ homebrew_prefix }}/bin/brew", list, "--{{ homebrew_kind | default('formula') }}", "-1"]
  register: homebrew_installed
  changed_when: false
  check_mode: false

- name: Install Homebrew packages
  ansible.builtin.command:
    argv: "{{ [homebrew_prefix ~ '/bin/brew', 'install', '--' ~ (homebrew_kind | default('formula'))] + homebrew_missing }}"
  vars:
    homebrew_missing: "{{ homebrew_names | difference(homebrew_installed.stdout_lines) }}"
  when: homebrew_missing | length > 0
  changed_when: true

- name: Upgrade Homebrew packages
  when: upgrade | bool
  block:
    - name: List outdated Homebrew packages
      ansible.builtin.command:
        argv: ["{{ homebrew_prefix }}/bin/brew", outdated, "--{{ homebrew_kind | default('formula') }}", --json=v2]
      register: homebrew_outdated
      changed_when: false
      check_mode: false

    - name: Upgrade outdated Homebrew packages
      ansible.builtin.command:
        argv: "{{ [homebrew_prefix ~ '/bin/brew', 'upgrade', '--' ~ (homebrew_kind | default('formula'))] + homebrew_to_upgrade }}"
      vars:
        homebrew_json_key: "{{ 'casks' if homebrew_kind | default('formula') == 'cask' else 'formulae' }}"
        homebrew_to_upgrade: "{{ (homebrew_outdated.stdout | from_json)[homebrew_json_key] | map(attribute='name') | intersect(homebrew_names) }}"
      when: homebrew_to_upgrade | length > 0
      changed_when: true
