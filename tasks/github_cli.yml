---
- name: Install GitHub CLI from GitHub's apt repository
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Add GitHub CLI apt repository
      ansible.builtin.deb822_repository:
        name: github-cli
        types: deb
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        architectures: "{{ deb_arch }}"
        signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      become: true

    - name: Install GitHub CLI
      ansible.builtin.apt:
        name: gh
        state: present
        update_cache: true
      become: true

- name: Install GitHub CLI
  ansible.builtin.command: pacman -S --needed --noconfirm github-cli
  environment:
    LC_ALL: C
  become: true
  register: github_cli_pacman
  changed_when: "'there is nothing to do' not in github_cli_pacman.stdout"
  when: ansible_facts['os_family'] == 'Archlinux'
