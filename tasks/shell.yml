---
- name: Configure macOS shell paths
  ansible.builtin.blockinfile:
    path: "{{ home }}/{{ item }}"
    marker: "# {mark} dev tools PATH (managed by vm-setup)"
    block: |
      eval "$({{ (homebrew_prefix ~ '/bin/brew') | quote }} shellenv)"
      export PNPM_HOME={{ pnpm_home | quote }}
      export PATH="$HOME/.local/bin:$PNPM_HOME/bin:{{ homebrew_prefix }}/opt/libpq/bin:$PATH"
    create: true
    mode: "0644"
  loop: [.zprofile, .zshrc, .bash_profile]
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [always]

- name: Load bash configuration in macOS login shells
  ansible.builtin.blockinfile:
    path: "{{ home }}/.bash_profile"
    marker: "# {mark} bashrc (managed by vm-setup)"
    block: '[ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"'
    create: true
    mode: "0644"
  when: ansible_facts['os_family'] == 'Darwin'
  tags: [always]

- name: Keep a long zsh history shared by all terminals
  ansible.builtin.blockinfile:
    path: "{{ home }}/.zshrc"
    marker: "# {mark} history (managed by vm-setup)"
    block: |
      HISTFILE="$HOME/.zsh_history"
      HISTSIZE=100000
      SAVEHIST=100000
      setopt APPEND_HISTORY SHARE_HISTORY HIST_IGNORE_ALL_DUPS HIST_IGNORE_SPACE
    create: true
    mode: "0644"
  when: ansible_facts['os_family'] == 'Darwin'

- name: Enable fzf key bindings in zsh
  ansible.builtin.blockinfile:
    path: "{{ home }}/.zshrc"
    marker: "# {mark} fzf (managed by vm-setup)"
    block: |
      if command -v fzf >/dev/null 2>&1; then
        source <(fzf --zsh)
      fi
    create: true
    mode: "0644"
  when: ansible_facts['os_family'] == 'Darwin'

- name: Keep a long bash history shared by all terminals
  ansible.builtin.lineinfile:
    path: "{{ home }}/.bashrc"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
    mode: "0644"
  loop:
    - { regexp: "^HISTSIZE=", line: "HISTSIZE=100000" }
    - { regexp: "^HISTFILESIZE=", line: "HISTFILESIZE=100000" }
    - { regexp: "^HISTCONTROL=", line: "HISTCONTROL=ignoreboth:erasedups" }
    - { regexp: "^shopt -s histappend", line: "shopt -s histappend" }

- name: Enable fzf key bindings in bash
  ansible.builtin.blockinfile:
    path: "{{ home }}/.bashrc"
    marker: "# {mark} fzf (managed by vm-setup)"
    block: |
      if fzf --bash >/dev/null 2>&1; then
        eval "$(fzf --bash)"
      elif [ -f /usr/share/doc/fzf/examples/key-bindings.bash ]; then
        . /usr/share/doc/fzf/examples/key-bindings.bash
      fi
    create: true
    mode: "0644"

- name: Set up Git LFS
  ansible.builtin.shell: git config --global --get filter.lfs.process || git lfs install --skip-repo
  register: git_lfs_install
  changed_when: "'Git LFS initialized' in git_lfs_install.stdout"
  when: "(homebrew_prefix ~ '/bin/git-lfs' if ansible_facts['os_family'] == 'Darwin' else '/usr/bin/git-lfs') is exists"
