---
- name: Upgrade global pnpm packages
  when:
    - upgrade | bool
    - not ansible_check_mode
  block:
    - name: Read global pnpm packages before update
      ansible.builtin.command:
        argv:
          [
            "{{ pnpm_home }}/bin/pnpm",
            list,
            --global,
            --json,
            --depth,
            Infinity,
          ]
      register: pnpm_globals_before
      changed_when: false

    - name: Run pnpm -g update
      ansible.builtin.command:
        argv: ["{{ pnpm_home }}/bin/pnpm", -g, update]
      changed_when: false

    - name: Read global pnpm packages after update
      ansible.builtin.command:
        argv:
          [
            "{{ pnpm_home }}/bin/pnpm",
            list,
            --global,
            --json,
            --depth,
            Infinity,
          ]
      register: pnpm_globals_after
      changed_when: >-
        (pnpm_globals_before.stdout | from_json | map(attribute='dependencies', default={}) |
         map('to_json', sort_keys=true) | sort | list) !=
        (pnpm_globals_after.stdout | from_json | map(attribute='dependencies', default={}) |
         map('to_json', sort_keys=true) | sort | list)
