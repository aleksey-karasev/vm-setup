"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000

format = """
[\ue0b6](color_pink)\
$os\
$username\
$hostname\
$sudo\
[\ue0b0](bg:color_purple fg:color_pink)\
$directory\
[\ue0b0](fg:color_purple bg:color_bg3)\
$git_branch\
$git_commit\
$git_state\
$git_status\
[\ue0b0](fg:color_bg3 bg:color_cyan)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[\ue0b0](fg:color_cyan bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[\ue0b0](fg:color_bg3 bg:color_bg1)\
$cmd_duration\
$time\
[\ue0b4 ](fg:color_bg1)\
$line_break\
$jobs\
$status\
$character"""

palette = 'dracula'

# Official Dracula colors; dark foregrounds keep bright segments readable.
[palettes.dracula]
color_fg0 = '#f8f8f2'
color_bg0 = '#282a36'
color_bg1 = '#282a36'
color_bg3 = '#44475a'
color_pink = '#ff79c6'
color_purple = '#bd93f9'
color_cyan = '#8be9fd'
color_green = '#50fa7b'
color_red = '#ff5555'
color_yellow = '#f1fa8c'

[os]
disabled = false
style = "bg:color_pink fg:color_bg0"

[os.symbols]
Windows = "\U000f0372"
Ubuntu = "\U000f0548"
SUSE = "\uf314"
Raspbian = "\U000f043f"
Mint = "\U000f08ed"
Macos = "\U000f0035"
Manjaro = "\uf312"
Linux = "\U000f033d"
Gentoo = "\U000f08e8"
Fedora = "\U000f08db"
Alpine = "\uf300"
Amazon = "\uf270"
Android = "\ue70e"
AOSC = "\uf301"
Arch = "\U000f08c7"
Artix = "\U000f08c7"
EndeavourOS = "\uf197"
CentOS = "\uf304"
Debian = "\U000f08da"
Redhat = "\U000f111b"
RedHatEnterprise = "\U000f111b"
Pop = "\uf32a"

[username]
show_always = true
style_user = "bg:color_pink fg:color_bg0"
style_root = "bg:color_red fg:color_bg0 bold"
format = '[ $user ]($style)'

[directory]
style = "fg:color_bg0 bg:color_purple"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = "\uf023 "                                      # lock icon
read_only_style = "fg:color_red bg:color_purple"
truncation_length = 3
truncation_symbol = "\u2026/"

[directory.substitutions]
"Documents" = "\U000f0219 "
"Downloads" = "\uf019 "
"Music" = "\U000f075a "
"Pictures" = "\uf03e "
"Developer" = "\U000f0c8b "

[status]
disabled = false
symbol = "\u2718"
style = 'bold fg:color_red'
format = '[$symbol$status( $signal_name)]($style) '

[jobs]
symbol = "\u2726"
style = 'bold fg:color_purple'
format = '[$symbol$number]($style) '

[git_branch]
symbol = "\uf418"
style = "bg:color_bg3"
format = '[[ $symbol $branch ](fg:color_pink bg:color_bg3)]($style)'

[git_status]
style = "bg:color_bg3"
format = '[[($all_status$ahead_behind )](fg:color_pink bg:color_bg3)]($style)'
ahead = "\u21e1${count}"
behind = "\u21e3${count}"
diverged = "\u21d5\u21e1${ahead_count}\u21e3${behind_count}"
staged = '+${count}'
modified = '!${count}'
untracked = '?${count}'
stashed = "\u2261${count}"
conflicted = '=${count}'

[git_commit]
style = "bg:color_bg3"
format = '[[$hash$tag ](fg:color_pink bg:color_bg3)]($style)'

[git_state]
style = "bg:color_bg3"
format = '[[$state( $progress_current/$progress_total) ](fg:color_pink bg:color_bg3 bold)]($style)'

[hostname]
ssh_only = true
ssh_symbol = "\uf233 "
style = "bg:color_pink fg:color_bg0"
format = '[$ssh_symbol$hostname ]($style)'

[sudo]
disabled = false
symbol = "\uf084"
style = "bg:color_pink fg:color_bg0"
format = '[$symbol ]($style)'

[nodejs]
symbol = "\ue718"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[bun]
symbol = "\ue76f"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[c]
symbol = "\ue61e "
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[cpp]
symbol = "\ue61d "
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[rust]
symbol = "\ue7a8"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[golang]
symbol = "\ue627"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[php]
symbol = "\ue608"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[java]
symbol = "\ue256"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[kotlin]
symbol = "\ue634"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[haskell]
symbol = "\ue61f"
style = "bg:color_cyan"
format = '[[ $symbol( $version) ](fg:color_bg0 bg:color_cyan)]($style)'

[python]
symbol = "\ue606"
style = "bg:color_cyan"
format = '[[ $symbol( $version)( \($virtualenv\)) ](fg:color_bg0 bg:color_cyan)]($style)'
python_binary = [".venv/bin/python", "python", "python3"]

[package]
disabled = true

[docker_context]
symbol = "\uf308"
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_cyan bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:color_cyan bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[cmd_duration]
style = "bg:color_bg1"
format = "[[ \uf252 $duration ](fg:color_fg0 bg:color_bg1)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = "[[ \uf43a $time ](fg:color_fg0 bg:color_bg1)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[\uf432](bold fg:color_pink)"
error_symbol = "[\uf432](bold fg:color_red)"
vimcmd_symbol = "[\uf434](bold fg:color_green)"
vimcmd_replace_one_symbol = "[\uf434](bold fg:color_purple)"
vimcmd_replace_symbol = "[\uf434](bold fg:color_purple)"
vimcmd_visual_symbol = "[\uf434](bold fg:color_yellow)"
